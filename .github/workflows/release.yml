name: Release npm packages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run the publish pass without publishing packages
        type: boolean
        default: false

concurrency:
  group: release-npm
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Run pack tests (gate)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          tests=(packages/*/tests/*.test.sh)
          if ((${#tests[@]} == 0)); then
            echo 'no pack tests found'
          fi

          for t in "${tests[@]}"; do
            echo "::group::$t"
            bash "$t"
            echo "::endgroup::"
          done

      - name: Publish changed packages
        shell: bash
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          published=0
          skipped=0

          for package_json in packages/*/package.json; do
            package_dir="$(dirname "$package_json")"

            is_private="$(node -p "require('./$package_json').private === true ? 'true' : 'false'")"
            if [[ "$is_private" == "true" ]]; then
              echo "$package_dir is private, skipping"
              ((skipped += 1))
              continue
            fi

            name="$(node -p "require('./$package_json').name")"
            version="$(node -p "require('./$package_json').version")"

            package_manifest="$package_dir/package.yaml"
            if [[ -f "$package_manifest" ]]; then
              manifest_version="$(sed -n 's/^version:[[:space:]]*//p' "$package_manifest")"
              if [[ -z "$manifest_version" || "$manifest_version" != "$version" ]]; then
                echo "::error file=$package_json::package.json version '$version' does not match package.yaml version '${manifest_version:-missing}'"
                exit 1
              fi
            fi

            published_version="$(npm view "$name@$version" version 2>/dev/null || true)"

            if [[ "$published_version" == "$version" ]]; then
              echo "$name@$version already published, skipping"
              ((skipped += 1))
              continue
            fi

            if [[ "${DRY_RUN:-false}" == "true" ]]; then
              echo "DRY_RUN=true: would publish $name@$version from $package_dir"
              ((skipped += 1))
              continue
            fi

            echo "Publishing $name@$version from $package_dir"
            # npm exchanges the GitHub Actions OIDC token with the trusted
            # publisher configured for this repository and workflow.
            npm publish "$package_dir" --access public
            ((published += 1))
          done

          echo "Summary: published=$published skipped=$skipped"
