name: Release npm packages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run the publish pass without publishing packages
        type: boolean
        default: false

concurrency:
  group: release-npm
  cancel-in-progress: false

# Trusted publisher (OIDC) — no long-lived NPM_TOKEN.
# Each package must list this repo + workflow as a trusted publisher on npmjs.com.
permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # Trusted publishing requires a recent npm that speaks GitHub OIDC.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Run pack tests (gate)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          tests=(packages/*/tests/*.test.sh)
          if ((${#tests[@]} == 0)); then
            echo 'no pack tests found'
          fi

          for t in "${tests[@]}"; do
            echo "::group::$t"
            bash "$t"
            echo "::endgroup::"
          done

      - name: Publish changed packages
        shell: bash
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          published=0
          skipped=0
          failed=0

          for package_json in packages/*/package.json; do
            package_dir="$(dirname "$package_json")"

            is_private="$(node -p "require('./$package_json').private === true ? 'true' : 'false'")"
            if [[ "$is_private" == "true" ]]; then
              echo "$package_dir is private, skipping"
              ((skipped += 1))
              continue
            fi

            name="$(node -p "require('./$package_json').name")"
            version="$(node -p "require('./$package_json').version")"
            published_version="$(npm view "$name@$version" version 2>/dev/null || true)"

            if [[ "$published_version" == "$version" ]]; then
              echo "$name@$version already published, skipping"
              ((skipped += 1))
              continue
            fi

            if [[ "${DRY_RUN:-false}" == "true" ]]; then
              echo "DRY_RUN=true: would publish $name@$version from $package_dir"
              ((skipped += 1))
              continue
            fi

            echo "Publishing $name@$version from $package_dir (trusted publisher / OIDC)"
            # Publish from repo root so npm uses root config; --provenance pairs with OIDC.
            if npm publish "$package_dir" --access public --provenance; then
              ((published += 1))
            else
              echo "::error::Failed to publish $name@$version (is trusted publisher configured for this package?)"
              ((failed += 1))
            fi
          done

          echo "Summary: published=$published skipped=$skipped failed=$failed"
          if ((failed > 0)); then
            exit 1
          fi
