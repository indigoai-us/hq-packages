name: Release npm packages

# Auto-publish changed packs to npm via npm OIDC trusted publishing — no static
# NPM_TOKEN. This mirrors how hq-cli and hq-cloud publish (org-shared reusable
# workflow indigoai-us/.github/.github/workflows/_npm-publish.yml), adapted for
# this multi-pack monorepo: those repos publish a single root package, whereas
# here we loop every `packages/*/package.json` and publish each pack whose
# version is not yet on npm.
#
# How OIDC trusted publishing works (why there is no token below):
#   - the job requests an OIDC identity token via `permissions: id-token: write`
#   - `actions/setup-node` points npm at the public registry
#   - npm >= 11.5 (bundled with Node 24) exchanges the OIDC token for a
#     short-lived, package-scoped credential at publish time
#   - each pack must have a Trusted Publisher configured on npmjs.com pointing at
#     this repo + this workflow file; until that is provisioned a real publish
#     fails with an auth error (the dry-run path still validates end to end)
# No `--provenance`: keep parity with the org-shared pipeline; provenance can be
# enabled later once trusted publishing is confirmed live for these packs.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run the publish pass without publishing packages
        type: boolean
        default: false

concurrency:
  group: release-npm
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required for npm OIDC trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Node 24 ships npm >= 11, which supports OIDC trusted publishing. Node 20
      # (npm 10) does NOT — do not downgrade or publishing silently loses OIDC.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: node --version && npm --version

      - name: Run pack tests (gate)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          tests=(packages/*/tests/*.test.sh)
          if ((${#tests[@]} == 0)); then
            echo 'no pack tests found'
          fi

          for t in "${tests[@]}"; do
            echo "::group::$t"
            bash "$t"
            echo "::endgroup::"
          done

      - name: Publish changed packages (OIDC)
        shell: bash
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          published=0
          skipped=0

          for package_json in packages/*/package.json; do
            package_dir="$(dirname "$package_json")"

            is_private="$(node -p "require('./$package_json').private === true ? 'true' : 'false'")"
            if [[ "$is_private" == "true" ]]; then
              echo "$package_dir is private, skipping"
              ((skipped += 1))
              continue
            fi

            name="$(node -p "require('./$package_json').name")"
            version="$(node -p "require('./$package_json').version")"
            published_version="$(npm view "$name@$version" version 2>/dev/null || true)"

            if [[ "$published_version" == "$version" ]]; then
              echo "$name@$version already published, skipping"
              ((skipped += 1))
              continue
            fi

            if [[ "${DRY_RUN:-false}" == "true" ]]; then
              echo "DRY_RUN=true: would publish $name@$version from $package_dir"
              ((skipped += 1))
              continue
            fi

            echo "Publishing $name@$version from $package_dir"
            # Publish the folder from the repo root so npm reads the registry
            # config setup-node wrote; OIDC needs no NODE_AUTH_TOKEN — npm mints a
            # short-lived credential from the id-token at publish time.
            npm publish "$package_dir" --access public
            ((published += 1))
          done

          echo "Summary: published=$published skipped=$skipped"
