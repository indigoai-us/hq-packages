name: Release npm packages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run the publish pass without publishing packages
        type: boolean
        default: false

concurrency:
  group: release-npm
  cancel-in-progress: false

# Trusted publisher on npm must list this exact workflow filename: release.yml
# (org/repo + filename must match each package's Trusted Publisher config).
permissions:
  contents: read
  id-token: write # Required for OIDC → npm trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          # Trusted publishing needs Node >= 22.14 and npm CLI >= 11.5.1
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Ensure npm supports trusted publishing
        run: |
          set -euo pipefail
          npm install -g npm@latest
          npm --version

      - name: Run pack tests (gate)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          tests=(packages/*/tests/*.test.sh)
          if ((${#tests[@]} == 0)); then
            echo 'no pack tests found'
          fi

          for t in "${tests[@]}"; do
            echo "::group::$t"
            bash "$t"
            echo "::endgroup::"
          done

      - name: Publish changed packages
        shell: bash
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          expected_repo='https://github.com/indigoai-us/hq-packages.git'
          published=0
          skipped=0
          failed=0
          failed_names=()

          for package_json in packages/*/package.json; do
            package_dir="$(dirname "$package_json")"

            is_private="$(node -p "require('./$package_json').private === true ? 'true' : 'false'")"
            if [[ "$is_private" == "true" ]]; then
              echo "$package_dir is private, skipping"
              ((skipped += 1))
              continue
            fi

            name="$(node -p "require('./$package_json').name")"
            version="$(node -p "require('./$package_json').version")"
            repo_url="$(node -p "const r=require('./$package_json').repository; typeof r === 'string' ? r : (r && r.url) || ''")"

            package_manifest="$package_dir/package.yaml"
            if [[ -f "$package_manifest" ]]; then
              manifest_version="$(sed -n 's/^version:[[:space:]]*//p' "$package_manifest")"
              if [[ -z "$manifest_version" || "$manifest_version" != "$version" ]]; then
                echo "::error file=$package_json::package.json version '$version' does not match package.yaml version '${manifest_version:-missing}'"
                exit 1
              fi
            fi

            published_version="$(npm view "$name@$version" version 2>/dev/null || true)"

            if [[ "$published_version" == "$version" ]]; then
              echo "$name@$version already published, skipping"
              ((skipped += 1))
              continue
            fi

            if [[ "$repo_url" != "$expected_repo" ]]; then
              echo "::error file=$package_json::repository.url must be '$expected_repo' for npm trusted publishing (got '${repo_url:-missing}')"
              exit 1
            fi

            if [[ "${DRY_RUN:-false}" == "true" ]]; then
              echo "DRY_RUN=true: would publish $name@$version from $package_dir"
              ((skipped += 1))
              continue
            fi

            echo "Publishing $name@$version from $package_dir via trusted publisher (OIDC)"
            # ./ prefix: bare "packages/foo" is parsed as github:packages/foo.
            # No NPM_TOKEN: npm exchanges the Actions OIDC token with the
            # trusted publisher configured for this repo + release.yml.
            # Continue on per-pack failure so one missing TP binding does not
            # block later packs that are correctly configured.
            if npm publish "./$package_dir" --access public; then
              ((published += 1))
            else
              # The npm error for this is E404 "Not found - PUT ... could not be
              # found or you do not have permission to access it", which reads
              # like the registry is missing rather than like a configuration
              # gap. Five of this workflow's ten failures in the 30 days to
              # 2026-08-17 were exactly this, on packages being published for
              # the first time. Spell out the fix rather than hinting at it.
              {
                echo "::error::Failed to publish $name@$version"
                echo "If npm reported E404 / 'you do not have permission', this is almost"
                echo "certainly a missing npm Trusted Publisher binding, not a missing package."
                echo ""
                echo "Configure it at:"
                echo "  https://www.npmjs.com/package/$name/access"
                echo "  (Settings -> Trusted Publisher -> GitHub Actions)"
                echo ""
                echo "Fields, exactly:"
                echo "  Organization or user: indigoai-us"
                echo "  Repository:           hq-packages"
                echo "  Workflow filename:    release.yml     (filename only, with extension)"
                echo "  Environment:          (leave empty)"
                echo ""
                echo "Note npm does NOT validate a trusted publisher configuration when you"
                echo "save it, so a typo in any field fails exactly like no configuration at"
                echo "all. Re-run this workflow after saving to confirm."
                echo ""
                echo "A brand-new package name may additionally require its first publish"
                echo "before the package settings page exists. If so, publish $name@$version"
                echo "once by hand, then configure the trusted publisher so every subsequent"
                echo "release goes through this workflow."
              } >&2
              failed_names+=("$name@$version")
              ((failed += 1))
            fi
          done

          echo "Summary: published=$published skipped=$skipped failed=$failed"
          if ((failed > 0)); then
            echo "::error::Publish failures: ${failed_names[*]}"
            exit 1
          fi
