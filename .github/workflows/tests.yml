name: pack-tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  shell-tests:
    name: shell-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run all pack test scripts
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=0
          for t in packages/*/tests/*.test.sh; do
            found=1
            echo "::group::$t"
            bash "$t"
            echo "::endgroup::"
          done
          if [ "$found" -eq 0 ]; then echo "no pack tests found"; fi
