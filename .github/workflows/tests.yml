name: pack-tests
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
jobs:
  shell-tests:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: shell-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Release-metadata integrity, checked at PR time. release.yml asserts the
      # same invariants, but only on push to main — after a mismatch has already
      # merged, which is why 5 of its 10 recent failures were this guard firing
      # too late. Running it here, inside the repo's only required check, stops
      # the mismatch at the PR instead. The release-time guards stay in place as
      # defence in depth.
      - name: Release manifest integrity
        run: bash tests/manifest-integrity.test.sh
      - name: HQ Anywhere generated package layout
        run: bash tests/hq-anywhere-package-layout.test.sh
      - name: HQ Anywhere daemon hook shim behavior
        run: bash tests/hqd-hook-shim.test.sh
      - name: HQ Anywhere daemon hook flag cache
        run: bash tests/hqd-hook-flag-cache.test.sh
      - name: HQ Anywhere runtime flag reader
        run: bash tests/hq-anywhere-runtime-flag.test.sh
      - name: HQ Anywhere plugin and Codex shim parity
        run: bash tests/hq-anywhere-shim-parity.test.sh
      # hq-pack-booking runs its TypeScript with Node's built-in type stripping
      # (Node 22.6+), so pin a Node version rather than relying on the image.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all pack test scripts
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=0
          for t in packages/*/tests/*.test.sh; do
            found=1
            echo "::group::$t"
            bash "$t"
            echo "::endgroup::"
          done
          if [ "$found" -eq 0 ]; then echo "no pack tests found"; fi
