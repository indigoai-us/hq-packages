<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="hq-pack-accounting — balanced books">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e7e7ff"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#1e1b4b" flood-opacity="0.40"/>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>

  <g filter="url(#soft)">
    <!-- fulcrum / pivot -->
    <path d="M256 146 L275 173 L237 173 Z" fill="url(#metal)"/>
    <!-- beam, perfectly level = the books balance -->
    <rect x="110" y="168" width="292" height="15" rx="7.5" fill="url(#metal)"/>
    <!-- pillar -->
    <rect x="248" y="173" width="16" height="205" rx="8" fill="url(#metal)"/>
    <!-- base -->
    <rect x="224" y="372" width="64" height="15" rx="7.5" fill="url(#metal)"/>
    <path d="M210 388 h92 a12 12 0 0 1 12 12 v6 H198 v-6 a12 12 0 0 1 12-12 Z" fill="url(#metal)"/>
    <!-- hangers -->
    <line x1="126" y1="176" x2="126" y2="222" stroke="url(#metal)" stroke-width="6" stroke-linecap="round"/>
    <line x1="386" y1="176" x2="386" y2="222" stroke="url(#metal)" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- pans, equal height = debits equal credits -->
  <path d="M82 222 a44 26 0 0 0 88 0 Z" fill="#34d399" stroke="#10b981" stroke-width="3"/>
  <path d="M342 222 a44 26 0 0 0 88 0 Z" fill="#34d399" stroke="#10b981" stroke-width="3"/>

  <!-- a coin on each pan -->
  <g fill="#ffffff" font-family="ui-sans-serif, system-ui, -apple-system, Arial, sans-serif" font-weight="700" font-size="30" text-anchor="middle">
    <text x="126" y="234">$</text>
    <text x="386" y="234">$</text>
  </g>
</svg>
