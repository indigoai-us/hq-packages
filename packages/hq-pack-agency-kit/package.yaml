name: hq-pack-agency-kit
version: 0.3.2
publisher: '@indigoai-us'
access: public
displayName: AI Builders Agency Kit
description: 'The AI Builders agency operating kit for HQ. Builds on hq-pack-client-service. Ships the Agency Guide, a personal bot that sets up the agency and runs client onboarding from the HQ app chat, with tap-to-answer questions and approval gates. The same flows are available as Claude Code commands: /agency-setup writes the agency playbook (profile, onboarding checklist, audit criteria, scope rules, example briefs and delivery plans) into the firm company. /client-workspace gives every client the same workspace layout, as a folder inside the agency or as the client''s own HQ company. /client-onboarding runs the onboarding system on a signed client: scope review, missing inputs, account audit and a kickoff package, each with sources and a human approval point, then feeds what the strategist caught back into the playbook. /practice-client loads a pre-filled practice client with planted gaps so students can try the whole flow on day one. Also ships /scope-check, /weekly-update and /proposal. AI Builders brand tokens in brand/.'
keywords:
  - hq
  - hq-pack
  - agency
  - ai-builders
  - client-onboarding
capabilities:
  - scripts
  - fs
requires:
  hqCore: '>=16.0.0-beta.50'
  packs:
    - name: hq-pack-client-service
      version: '>=0.2.0'
contributes:
  workers:
    - agency-guide
  skills:
    - agency-setup
    - client-workspace
    - client-onboarding
    - practice-client
    - scope-check
    - weekly-update
    - proposal
  knowledge:
    - agency-kit
  policies:
    - agency-kit-evidence-before-commitment
    - agency-kit-playbook-learns
  hooks: []
  commands: []
  scripts: []
initialization:
  entrypoint: /agency-setup
  welcome: 'Welcome to the AI Builders Agency Kit. In the HQ app, your Agency Guide bot sets up the agency and walks you through a practice client in chat. In Claude Code, run /agency-setup to set up your agency, then /practice-client to try the onboarding system on a sample client. When a real client signs: /new-client, /client-workspace, /client-onboarding.'
setup:
  bot:
    name: agency-guide              # bot handle; also the worker id under contributes.workers
    display_name: Agency Guide
    intro: "Hi, I'm your Agency Guide. I'll set up your agency in HQ and show you how it works on a practice client. Six quick questions."
  takeover_setup: true              # if HQ's setup bot has not finished, this bot finishes it first
  questions:
    - id: agency_name
      text: "What's your agency called, as clients see it?"
      goal: "The name clients know them by."
      default_from: company_display_name   # optional; the bot proposes it and asks to confirm
      options: []                          # free text only
      skippable: false
    - id: services
      text: "What do you sell?"
      goal: "What they sell and, per service, what the client actually gets, enough to tell in-scope work from out-of-scope work."
      options: ["Paid ads", "SEO and content", "Web and design", "Automations and AI", "Something else"]
      skippable: true
    - id: ideal_client
      text: "Who do you sell to?"
      goal: "Who they do their best work for, sharp enough to spot a bad-fit lead: industry, size or spend, stage."
      options: ["Ecommerce brands", "B2B SaaS", "Local businesses", "Professional services"]
      skippable: true
    - id: pricing
      text: "How do you charge?"
      goal: "How a price is built, well enough to check a proposal or scope change against it: the model, what it varies with, typical ranges or minimums."
      options: ["Monthly retainer", "Per project", "Performance based", "A mix"]
      skippable: true
    - id: tools
      text: "Which tools do you run? CRM, project management, reporting, ad platforms."
      goal: "The CRM, project management, reporting and ad platforms they use (not how to connect them)."
      options: ["HubSpot and Asana", "Notion and Slack", "Google Sheets and email", "Not sure yet"]
      skippable: true
    - id: voice
      text: "How do you sound with clients, in a few words?"
      goal: "How they sound with clients, specific enough to write in."
      options: ["Direct and plain", "Warm and friendly", "Formal and precise"]
      skippable: true
  run:
    script: scripts/agency-setup.sh      # relative to the pack root
    args:                                 # question id -> flag; the bot passes --firm itself
      agency_name: --name
      services: --services
      ideal_client: --ideal-client
      pricing: --pricing
      tools: --tools
      voice: --voice
    then:                                 # run after `script`, in order, same --firm
      - scripts/practice-setup.sh --agency-name {agency_name}
  documents:                            # asked for once, early; the bot reads them and asks less
    - a rate card or pricing sheet
    - a recent proposal or statement of work
    - a case study
  done:
    message: "Your agency playbook is written. You'll find it in Files under Knowledge, Agency Playbook. Northwind Labs just signed with you."
    suggestion: "Run Northwind's onboarding"
