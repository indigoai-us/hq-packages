name: hq-pack-agency-kit
version: 0.4.11
publisher: '@indigoai-us'
access: public
displayName: AI Builders Agency Kit
description: 'The AI Builders agency operating kit for HQ. Builds on hq-pack-client-service. Ships the Agency Guide, a personal bot that sets up the agency (an agency brain, a brain per current client, and connected tools, learned from the agency''s apps) and runs client onboarding from the HQ app chat, with tap-to-answer questions and approval gates. The same flows are available as Claude Code commands: /agency-setup writes the agency playbook (profile, onboarding checklist, audit criteria, scope rules, example briefs and delivery plans) into the firm company. /client-workspace gives every client the same workspace layout, as a folder inside the agency or as the client''s own HQ company. /client-onboarding runs the onboarding system on a signed client: scope review, missing inputs, account audit and a kickoff package, each with sources and a human approval point, then feeds what the strategist caught back into the playbook. /practice-client loads a pre-filled practice client with planted gaps so students can try the whole flow on day one. Also ships /scope-check, /weekly-update and /proposal. AI Builders brand tokens in brand/.'
keywords:
  - hq
  - hq-pack
  - agency
  - ai-builders
  - client-onboarding
capabilities:
  - scripts
  - fs
requires:
  hqCore: '>=16.0.0-beta.50'
  packs:
    - name: hq-pack-client-service
      version: '>=0.2.0'
contributes:
  workers:
    - agency-guide
  skills:
    - agency-setup
    - client-workspace
    - client-onboarding
    - practice-client
    - scope-check
    - weekly-update
    - proposal
  knowledge:
    - agency-kit
  policies:
    - agency-kit-evidence-before-commitment
    - agency-kit-playbook-learns
  hooks: []
  commands: []
  scripts: []
initialization:
  entrypoint: /agency-setup
  welcome: 'Welcome to the AI Builders Agency Kit. In the HQ app, your Agency Guide bot sets up your agency in chat: a brain for your agency, one for each current client, and your tools connected, learned from your apps. In Claude Code, run /agency-setup to set up your agency, then /practice-client to try the onboarding system on a sample client. When a real client signs: /new-client, /client-workspace, /client-onboarding.'
setup:
  bot:
    name: agency-guide              # bot handle; also the worker id under contributes.workers
    display_name: Agency Guide
    intro: "Hi, I'm your Agency Guide. I'll get your agency set up in HQ in a few minutes: a brain for your agency and a workspace for each of your clients. If you connect your apps, I'll use them to find your clients and fill in the details, so you type as little as possible."
  takeover_setup: true              # if HQ's setup bot has not finished, this bot finishes it first
  questions:
    - id: agency_name
      text: "What's your agency called, as clients see it?"
      goal: "The name clients know them by."
      default_from: company_display_name   # optional; the bot proposes it and asks to confirm
      options: []                          # free text only
      skippable: false
    - id: services
      text: "What do you sell?"
      goal: "What they sell and, per service, what the client actually gets, enough to tell in-scope work from out-of-scope work."
      options: ["Paid ads", "SEO and content", "Web and design", "Automations and AI", "Something else"]
      skippable: true
    - id: ideal_client
      text: "Who do you sell to?"
      goal: "Who they do their best work for, sharp enough to spot a bad-fit lead: industry, size or spend, stage."
      options: ["Ecommerce brands", "B2B SaaS", "Local businesses", "Professional services"]
      skippable: true
    - id: pricing
      text: "How do you charge?"
      goal: "How a price is built, well enough to check a proposal or scope change against it: the model, what it varies with, typical ranges or minimums."
      options: ["Monthly retainer", "Per project", "Performance based", "A mix"]
      skippable: true
    - id: tools
      text: "Which tools do you run? CRM, project management, reporting, ad platforms."
      goal: "The CRM, project management, reporting and ad platforms they use (not how to connect them)."
      options: ["HubSpot and Asana", "Notion and Slack", "Google Sheets and email", "Not sure yet"]
      skippable: true
    - id: voice
      text: "How do you sound with clients, in a few words?"
      goal: "How they sound with clients, specific enough to write in."
      options: ["Direct and plain", "Warm and friendly", "Formal and precise"]
      skippable: true
  run:
    script: scripts/agency-setup.sh      # relative to the pack root
    args:                                 # question id -> flag; the bot passes --firm itself
      agency_name: --name
      services: --services
      ideal_client: --ideal-client
      pricing: --pricing
      tools: --tools
      voice: --voice
  sources:                              # kinds of tools: asked about (typed answer), connected, then read (with a yes)
    - kind: email
      read: "the last 30 emails you sent to clients"
      informs: [services, ideal_client, pricing, voice]
      options:
        - {name: Gmail, available: false, note: "reading email comes in a later update"}
        - {name: Outlook, available: false, note: "reading email comes in a later update"}
    - kind: CRM
      read: "your recent deals and the companies on them"
      informs: [ideal_client, services, pricing]
      options:
        - {name: HubSpot, available: false, note: "HubSpot comes in a later update"}
        - {name: Salesforce, available: false, note: "Salesforce comes in a later update"}
        - {name: Pipedrive, domain: pipedrive.com}
        - {name: Close, domain: close.com}
    - kind: team chat
      read: "your channel list, to find your clients and their channels"
      informs: [ideal_client]
      options:
        - {name: Slack, tool: scripts/slack.mjs, connect: "connect --company <company slug>", status: status, usage: "channels (enough for setup) | history <channelId> | thread <channelId> <threadTs> | search <query>"}
        - {name: Teams, available: false, note: "Teams comes in a later update"}
    - kind: docs and SOPs
      read: "your SOPs, process docs, proposals and rate cards"
      informs: [services, pricing, voice]
      options:
        - {name: Google Drive, tool: scripts/drive.mjs, connect: connect, status: status, usage: "search <terms> | recent | read <fileId>"}
        - {name: Notion, domain: notion.so}
        - {name: Dropbox, domain: dropbox.com}
    - kind: project management
      read: "your active client projects"
      informs: [services]
      options:
        - {name: ClickUp, domain: clickup.com}
        - {name: Monday, domain: monday.com}
        - {name: Asana, domain: asana.com}
  documents:                            # asked for once, early; the bot reads them and asks less
    - a rate card or pricing sheet
    - a recent proposal or statement of work
    - a case study
    - an SOP or process doc
  done:
    message: "Your agency is set up in HQ. Here's what I set up:"
    suggestion: "Show me a client workspace"
