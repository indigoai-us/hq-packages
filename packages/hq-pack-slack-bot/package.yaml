name: hq-pack-slack-bot
version: 1.0.5
publisher: '@indigoai-us'
access: public
description: 'Per-bot Slack mention watcher + spawned-worker template. Watches every channel a chosen HQ-issued Slack bot is a member of, dispatches one autonomous Claude worker per @-mention. Pairs with hq-pro slack-app-factory (/hq-new-bot).'
requires:
  hqCore: '>=12.0.0'
  # Runtime prerequisites:
  #   - `hq` CLI on PATH
  #   - `curl`, `jq`, `awk`, `python3`
  #   - HQ vault holding HQ_SLACK_BOT_TOKEN_<NAME>_<WORKSPACE> (+ optional
  #     HQ_SLACK_BOT_CREATOR_<NAME>_<WORKSPACE> companion) for each bot
  #     you want to run. Created by hq-pro's /hq-new-bot flow.
contributes:
  workers:
    - slack-mention-worker
  knowledge: []
  skills:
    - run-bot
    - slack-ui
  hooks: []
  policies: []
  commands: []
  # scripts/ payload ships the watcher + parsers + vendored Claude
  # worker dispatcher. scan-packages.sh (S3) symlinks these into the
  # host instance's scripts/ directory at install time. The pack is
  # self-contained — claude-worker.sh + claude-worker-template.sh +
  # claude-pty-spawn.py are vendored copies of personal/tools/ originals
  # so the pack runs without any personal/ symlinks.
  # slack-ui.sh is the Block Kit structured-status helper (US-001).
  scripts:
    - watch.sh
    - parse-mentions.py
    - poll-thread.py
    - claude-worker-template.sh
    - claude-worker.sh
    - claude-pty-spawn.py
    - slack-ui.sh
