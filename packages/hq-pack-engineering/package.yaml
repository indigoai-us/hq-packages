name: hq-pack-engineering
version: 1.8.0
publisher: '@indigoai-us'
access: public
description: 'Engineering capabilities for HQ — code review, debugging, testing, PR lifecycle, story execution (Ralph), and the worker team that executes coding work. Install when you use HQ to manage repos.'
requires:
  hqCore: '>=14.2.0'
contributes:
  workers:
    - accessibility-auditor
    - frontend-designer
    - performance-benchmarker
    - qa-tester
    - security-scanner
    - site-builder
  knowledge:
    - Ralph
    - agent-browser
    - ai-security-framework
    - dev-team
  skills:
    - architect
    - clean-worktree
    - codebase-design
    - commit-main
    - deep-plan
    - diagnose
    - discover
    - document-release
    - domain-modeling
    - execute-task
    - investigate
    - land
    - land-batch
    - outpost-host
    - prd
    - publish-docs
    - quality-gate
    - review
    - run-pipeline
    - run-project
    - ship
    - tdd
    - to-tickets
    - wayfinder
  hooks:
    # PreToolUse warn/redirect: nudge competing browser MCP tools toward the
    # agent-browser CLI (non-blocking). SessionStart: install reminder if missing.
    # Auto-discovered by master-hook.sh from core/packages/*/hooks/<event>/.
    - PreToolUse/50-prefer-agent-browser
    - SessionStart/50-agent-browser-presence-check
  policies:
    - e2e-testing-standards
    - hq-bugfix-requires-tests
    - hq-no-test-shortcuts
    - hq-prefer-agent-browser
  commands: []
