name: hq-pack-work-mesh
version: 0.2.0
publisher: '@indigoai-us'
access: private
description: >
  Work-mesh pack (0.2.0): genesis on /prd, Board helpers, and docs pointing at
  hq mesh daemon. The legacy listen/watch cache daemon is removed — install
  presence with `hq mesh daemon install` from hq-cli.
requires:
  hqCore: '>=12.0.0'
initialization:
  entrypoint: work-mesh
  prompt: >
    Work-mesh pack 0.2.0 is installed. Run
    `bash core/packages/hq-pack-work-mesh/scripts/apply.sh` to wire genesis and
    unload any legacy ai.getindigo.hq-work-mesh-listen LaunchAgent. Presence and
    spool flush: `hq mesh daemon install` (hq-cli). Do not reinstall listen.
contributes:
  workers: []
  knowledge:
    - work-mesh
  skills:
    - work-mesh
  hooks: []
  policies:
    - hq-work-mesh-source-of-truth
    - hq-work-mesh-prd-genesis
  commands:
    - work-mesh
  scripts:
    - hq-work-mesh.sh
    - hq-work-mesh.mjs
    - hq-work-mesh-genesis.sh
