name: hq-pack-screen-recorder
version: 0.1.0
publisher: '@indigoai-us'
access: public
description: 'Record a process on your Mac from an HQ company session with /record-process. Screen, webcam and narration stay as separate layers and save to that company''s vault. The recorder app is built on your Mac from source in this pack; capture, transcription and draft writing run on the Mac. Development release: the recorder opens and binds to the company, but capture is not built yet.'
requires:
  hqCore: '>=12.0.0'
  # Runtime prerequisites:
  #   - Apple Silicon Mac on macOS 26 or later
  #   - Apple Command Line Tools (xcode-select --install); full Xcode is not needed
  #   - bash, python3 (stdlib only)
  #   - Screen Recording, Camera and Microphone permission for "HQ Recorder",
  #     asked by macOS at first use — see knowledge/screen-recorder/setup.md
contributes:
  workers: []
  knowledge:
    - screen-recorder
  skills:
    - record-process
  hooks: []
  policies: []
  commands: []
  scripts:
    - hq-record-process.sh
keywords:
  - hq
  - hq-pack
  - screen-recorder
  - sop
  - macos
license: MIT
repository: 'https://github.com/indigoai-us/hq-packages'
