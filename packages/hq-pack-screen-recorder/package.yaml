name: hq-pack-screen-recorder
version: 0.2.0
publisher: '@indigoai-us'
access: public
description: 'HQ Capture for HQ: /record-process records a process on your Mac from a company session, with screen, camera and narration as separate layers saved to that company''s recordings folder. The agent in the session then summarizes, trims, places the camera, exports the video and drafts a step-by-step guide. The app is built on your Mac from source in this pack; capture, transcription and drafting run on the Mac.'
requires:
  hqCore: '>=12.0.0'
  # Runtime prerequisites:
  #   - Apple Silicon Mac on macOS 26 or later
  #   - Apple Command Line Tools (xcode-select --install); full Xcode is not needed
  #   - bash, python3 (stdlib only)
  #   - Screen Recording, Camera and Microphone permission for "HQ Capture",
  #     asked by macOS at first use — see knowledge/screen-recorder/setup.md
contributes:
  workers: []
  knowledge:
    - screen-recorder
  skills:
    - record-process
  hooks: []
  policies: []
  commands: []
  scripts:
    - hq-record-process.sh
keywords:
  - hq
  - hq-pack
  - screen-recorder
  - sop
  - macos
license: MIT
repository: 'https://github.com/indigoai-us/hq-packages'
