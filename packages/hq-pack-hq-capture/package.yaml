name: hq-pack-hq-capture
version: 0.2.0
publisher: '@indigoai-us'
access: private
description: 'HQ Capture for HQ: /record-process records a process on your Mac from a company session, with screen, camera and narration as separate layers saved to that company''s recordings folder. The agent in the session then summarizes, trims, places the camera, exports the video and drafts a step-by-step guide. HQ Capture ships inside the HQ desktop app (macOS 26 or later), which opens it and asks macOS for access as HQ; this pack builds nothing. Capture, transcription and guide drafting run on the Mac. The session agent reads the transcript, the guide drafts and the stills it shows so you can edit by conversation. Nothing is uploaded to any other service or shared with another company, and the recording syncs to the company vault only when you ask.'
requires:
  hqCore: '>=15.0.179'
  # Runtime prerequisites:
  #   - Mac on macOS 26 or later
  #   - The HQ desktop app with HQ Capture inside it
  #     (https://hqforwork.com/install); without it /record-process prints
  #     the install link and starts nothing
  #   - bash, python3 (stdlib only)
  #   - Screen Recording, Camera and Microphone permission for HQ, asked in
  #     HQ's own permission window — see knowledge/hq-capture/setup.md
contributes:
  workers: []
  knowledge:
    - hq-capture
  skills:
    - record-process
  hooks: []
  policies: []
  commands: []
  scripts:
    - hq-record-process.sh
keywords:
  - hq
  - hq-pack
  - hq-capture
  - sop
  - macos
license: MIT
repository: 'https://github.com/indigoai-us/hq-packages'
